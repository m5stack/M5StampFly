; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    fastled/FastLED @ 3.10.3
    tinyu-zhao/INA3221 @ 0.0.1
    mathertel/OneButton @ 2.6.2

build_type = release
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O0

extra_scripts = post:generate_user_custom.py

custom_firmware_version = 0.0.1
custom_firmware_suffix = .bin
custom_firmware_dir = ./

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 7.0.1
custom_firmware_name = stampfly_firmware


[env:esp32-s3-devkitc-1-arduino3311]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
custom_firmware_name = stampfly_firmware3311
